<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Tickets Terrain</title>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">HDPI</span>
      <div>
        <h1>Tickets Terrain</h1>
        <div class="sub">Vue admin</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggleBtn" type="button" aria-label="Changer le thème">🌙</button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Réglages">⚙️</button>
      <a class="logout-link" href="{{ url_for('admin_logout') }}">Se déconnecter</a>
    </div>
  </header>

  <main class="view">
    <div class="stat-grid" id="adminStats"></div>

    <div class="filter-bar">
      <div class="chip-row" id="techChips"></div>
      <select id="statusFilter">
        <option value="all">Tous les statuts</option>
        <option value="en_attente">En attente</option>
        <option value="valide">Validé</option>
        <option value="rejete">Rejeté</option>
      </select>
    </div>

    <div>
      <div class="section-title">Tous les tickets</div>
      <div class="ticket-list" id="adminTicketList"></div>
    </div>
  </main>
</div>

<dialog id="settingsDialog">
  <div class="dialog-head">
    <h2>Réglages</h2>
    <button class="dialog-close" data-close="settingsDialog" aria-label="Fermer" type="button">&times;</button>
  </div>
  <div class="dialog-body">
    <div class="settings-section">
      <h3>Apparence</h3>
      <div class="theme-choice">
        <button class="theme-btn" id="themeLightBtn" type="button"><span class="icon">☀️</span>Clair</button>
        <button class="theme-btn" id="themeDarkBtn" type="button"><span class="icon">🌙</span>Sombre</button>
      </div>
    </div>
    <div class="settings-section">
      <h3>Données</h3>
      <button class="export-btn" id="exportBtn" type="button"><span>⬇️</span> Exporter tous les tickets (CSV)</button>
    </div>
  </div>
</dialog>

<dialog id="lightbox">
  <img id="lightboxImg" src="" alt="Ticket agrandi">
</dialog>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Tickets Terrain</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">HDPI</span>
      <div>
        <h1>Tickets Terrain</h1>
        <div class="sub">Vue admin</div>
      </div>
    </div>
    <a class="logout-link" href="{{ url_for('admin_logout') }}">Se déconnecter</a>
  </header>

  <main class="view">
    <div class="stat-grid" id="adminStats"></div>

    <div class="filter-bar">
      <div class="chip-row" id="techChips"></div>
      <select id="statusFilter">
        <option value="all">Tous les statuts</option>
        <option value="en_attente">En attente</option>
        <option value="valide">Validé</option>
        <option value="rejete">Rejeté</option>
      </select>
    </div>

    <div>
      <div class="section-title">Tous les tickets</div>
      <div class="ticket-list" id="adminTicketList"></div>
    </div>
  </main>
</div>

<dialog id="lightbox">
  <img id="lightboxImg" src="" alt="Ticket agrandi">
</dialog>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
